<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olimpo 9mm Jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Silkscreen:wght@400;700&family=Inter:wght@400;600&display=swap">
<style>
  /* Layout: jogo em tela cheia; telas (login, fases, intro, fim) como folhas de papel sobre o canvas. Estética: gravura grafite, papel claro, dourado; o pop em pixel. */
  :root {
    --paper: #F5F2EC;
    --paper-2: #FBF9F4;
    --graphite: #2B2B2B;
    --soft: #6B665E;
    --gold: #C9A45C;
    --gold-deep: #9C7A36;
    --line: #D9D2C3;
    --display: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
    --pixel: "Silkscreen", "Courier New", monospace;
    --ui: "Inter", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  body {
    background: var(--paper); color: var(--graphite); font-family: var(--ui); overflow: hidden;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
  }
  .game { position: relative; height: 100%; width: 100%; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  @supports (height: 100dvh) { .game { height: 100dvh; } }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; overflow-y: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    background: rgba(245, 242, 236, 0.9);
  }
  .sheet {
    position: relative; background: var(--paper-2); border: 1px solid var(--graphite); outline: 1px solid var(--graphite); outline-offset: 5px;
    width: min(30rem, 100%); box-sizing: border-box; padding: 28px 22px; text-align: center; margin: auto; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 14px; align-items: stretch;
  }
  .cover { display: block; width: min(300px, 78%); height: auto; margin: 0 auto 4px; mix-blend-mode: multiply; }
  .kicker { font-family: var(--ui); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--soft); margin: 0; }
  .title { font-family: var(--display); font-weight: 700; font-size: clamp(2.3rem, 10vw, 3.2rem); line-height: 0.95; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; }
  .title em { display: block; font-style: italic; font-weight: 500; text-transform: none; font-size: 0.62em; color: var(--gold-deep); letter-spacing: 0; margin-top: 6px; }
  .lead { margin: 0; font-size: 0.95rem; line-height: 1.45; color: var(--graphite); }
  .note { margin: 0; font-size: 0.78rem; line-height: 1.4; color: var(--soft); }
  .pix { font-family: var(--pixel); }
  .btn {
    font-family: var(--ui); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.06em;
    background: var(--graphite); color: var(--paper); border: 0; padding: 14px 18px; cursor: pointer; width: 100%;
  }
  .btn:hover { background: #000; }
  .btn.ghost { background: transparent; color: var(--graphite); border: 1px solid var(--graphite); }
  .btn.ghost:hover { background: var(--paper); }
  .btn.gold { background: var(--gold); color: var(--graphite); }
  .btn.gold:hover { background: #D8B56C; }
  .btn:focus-visible, .phase:focus-visible, .link:focus-visible, input:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; }
  .google { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: var(--graphite); border: 1px solid var(--line); }
  .google:hover { background: #fff; border-color: var(--graphite); }
  .google .g { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--graphite); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 0.85rem; }
  form { display: grid; gap: 10px; text-align: left; }
  label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); display: grid; gap: 6px; }
  input { font: 1rem var(--ui); padding: 12px; border: 1px solid var(--graphite); background: #fff; color: var(--graphite); text-transform: none; letter-spacing: 0; }
  .err { color: #8E2F22; font-size: 0.85rem; margin: 0; min-height: 1em; }
  .phases { display: grid; gap: 8px; }
  .phase {
    display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; text-align: left;
    background: #fff; border: 1px solid var(--line); padding: 12px; cursor: pointer; font: inherit; color: inherit;
  }
  .phase:hover { border-color: var(--graphite); }
  .phase .num { font-family: var(--display); font-weight: 700; font-size: 1.4rem; color: var(--gold-deep); text-align: center; }
  .phase .nm { font-family: var(--display); font-weight: 700; font-size: 1.05rem; display: block; }
  .phase .cl { font-size: 0.78rem; color: var(--soft); }
  .phase .best { font-family: var(--pixel); font-size: 0.8rem; color: var(--graphite); text-align: right; min-width: 3.5em; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .how { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; text-align: left; font-size: 0.95rem; line-height: 1.4; }
  .how li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
  .how li::before { content: "✦"; color: var(--gold-deep); font-size: 0.9rem; line-height: 1.5; }
  .score { font-family: var(--pixel); font-weight: 700; font-size: 3rem; line-height: 1; margin: 0; font-variant-numeric: tabular-nums; }
  .rank { width: 100%; border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
  .rank th { font-size: 0.68rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--soft); font-weight: 600; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--graphite); }
  .rank td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .rank td.n, .rank th.n { text-align: right; font-family: var(--pixel); }
  .rank td.p { width: 2.2em; font-family: var(--display); font-weight: 700; color: var(--gold-deep); }
  .rank tr.me td { background: rgba(201, 164, 92, 0.22); font-weight: 600; }
  .posbox { border-top: 1px solid var(--graphite); border-bottom: 1px solid var(--graphite); padding: 16px 0 14px; display: grid; gap: 4px; }
  .posbox:empty { display: none; }
  .posbox .lbl { margin: 0; font-family: var(--display); font-size: 1.05rem; }
  .posbox .pos { margin: 0; font-family: var(--display); font-weight: 700; font-size: 3.4rem; line-height: 1; color: var(--graphite); }
  .posbox .pos em { font-style: italic; font-weight: 500; font-size: 0.42em; color: var(--gold-deep); margin-left: 6px; }
  .posbox .pts { margin: 0; font-family: var(--pixel); font-size: 0.9rem; }
  .posbox .sub { margin: 6px 0 0; font-size: 0.82rem; color: var(--soft); }
  .rstatus:empty { display: none; }
  .rank tr.gap td { text-align: center; color: var(--soft); border-bottom: 0; padding: 2px; }
  .medal { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--gold); margin-left: 6px; vertical-align: 0.05em; }
  .link { background: none; border: 0; color: var(--soft); font: inherit; font-size: 0.82rem; text-decoration: underline; cursor: pointer; padding: 4px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); translate: -50% 0; z-index: 20; width: min(26rem, calc(100% - 32px)); box-sizing: border-box;
    background: var(--graphite); color: var(--paper); padding: 14px 18px; font: 600 0.92rem/1.4 var(--ui); text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast b { color: var(--gold); }
  .hudbtn {
    position: absolute; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(12px, env(safe-area-inset-left, 0px));
    font-family: var(--pixel); font-size: 0.75rem; background: var(--paper-2); color: var(--graphite); border: 1px solid var(--graphite); padding: 8px 10px; cursor: pointer;
  }
</style>
</head>

<script>
(() => {
  // ================= base =================
  const C = { paper: "#F5F2EC", paper2: "#FBF9F4", ink: "#2B2B2B", soft: "#6B665E", gold: "#C9A45C", goldDeep: "#9C7A36", line: "#D9D2C3", red: "#8E2F22" };
  const FD = '"Playfair Display", Georgia, serif', FP = 'Silkscreen, "Courier New", monospace', FU = 'Inter, system-ui, sans-serif';
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const $ = (id) => document.getElementById(id);
  let W = 0, H = 0, S = 1, dpr = 1, insetTop = 0, insetBottom = 0, HUD = 60;
  const touch = matchMedia("(pointer: coarse)").matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.max(0.8, Math.min(1.25, Math.min(W / 430, H / 720)));
    const cs = getComputedStyle($("game"));
    insetTop = parseFloat(cs.getPropertyValue("--sat")) || 0;
    insetBottom = parseFloat(cs.getPropertyValue("--sab")) || 0;
    HUD = insetTop + 64 * S;
    buildSun();
    if (cur && cur.resize) cur.resize();
    if (!running) drawIdle();
  }

  // textura de papel e de ouro (geradas uma vez)
  function noiseCanvas(size, base, spots) {
    const c = document.createElement("canvas"); c.width = c.height = size;
    const x = c.getContext("2d"); x.fillStyle = base; x.fillRect(0, 0, size, size);
    for (let i = 0; i < size * size * 0.18; i++) {
      const s = spots[Math.floor(Math.random() * spots.length)];
      x.fillStyle = s; x.fillRect(Math.random() * size, Math.random() * size, 1, 1);
    }
    return c;
  }
  const paperTex = noiseCanvas(160, C.paper, ["rgba(43,43,43,0.05)", "rgba(43,43,43,0.03)", "rgba(255,255,255,0.5)"]);
  const goldTex = noiseCanvas(96, C.gold, ["rgba(255,240,200,0.45)", "rgba(120,90,30,0.35)", "rgba(255,255,255,0.3)", "rgba(156,122,54,0.5)"]);
  let paperPat, goldPat;
  function pats() { paperPat = ctx.createPattern(paperTex, "repeat"); goldPat = ctx.createPattern(goldTex, "repeat"); }
  pats();

  // pixel art: cada string é uma linha; o mapa de cores diz o que pintar
  function pix(rows, x, y, p, colors) {
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) {
      const col = colors[rows[r][c]]; if (!col) continue;
      ctx.fillStyle = col; ctx.fillRect(Math.round(x + c * p), Math.round(y + r * p), Math.ceil(p), Math.ceil(p));
    }
  }
  const BMP = {
    bolt: ["..###", ".###.", "###..", "#####", "..###", ".###.", ".##..", "##..."],
    cup: [".#.#..", "..#.#.", "......", "#####.", "######", "#####.", ".###.."],
    scroll: ["######", "#....#", "#.##.#", "#....#", "#.###.", "######"],
    eye: ["##", "#o"],
    excl: ["##", "##", "##", "##", "..", "##"],
    heart: [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."],
    env: ["########", "##....##", "#.#..#.#", "#..##..#", "#......#", "########"]
  };

  function hatch(x, y, w, h, gap, ang, col, lw) {

  const G = { score: 0, lives: 3, maxLives: 3 };

  function popText(txt, x, y, opts = {}) { floats.push({ x, y, txt, c: opts.c || C.ink, life: opts.life || 1.1, font: opts.font || FD, size: opts.size || 22 }); }

  const mem = {};

  function saveBest(i, s) { const b = bests(); if (s > b[i]) { b[i] = s; store.set("olimpo9mm-v2-bests-" + player.email, JSON.stringify(b)); return true; } return false; }

  const API = "https://script.google.com/macros/s/AKfycbzs5Ut1MEHeQFPg3mSfzZws6Vpv2ME1zugjatTL-Ao8oyZ9lxBOx2nvkkbSKFK14fi0AA/exec";
  let rankData = null, rankTab = "ouro", rankState = "idle";
  const EXPLAIN = { ouro: "Ranking de Ouro: soma do seu melhor resultado em cada uma das cinco fases.", dedicacao: "Dedicação: soma de todos os pontos de todas as partidas que você jogou." };
  function queue() { try { return JSON.parse(store.get("olimpo9mm-fila") || "[]"); } catch (e) { return []; } }
  function setQueue(q) { store.set("olimpo9mm-fila", JSON.stringify(q)); }
  async function postScore(item) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(item) });
    const d = await r.json();
    if (!d || d.ok === false) throw Object.assign(new Error((d && d.erro) || "Erro"), { final: true });
    return d;
  }
  async function flushQueue() {

      q.shift(); setQueue(q);
    }
    return last;
  }

        // urgentes mergulham
        const urg = formation.filter((f) => f.type === "urg");
        if (urg.length && Math.random() < dt * (0.15 + wave * 0.07)) { const f = urg[Math.floor(Math.random() * urg.length)]; f.dive = true; f.bx = f.x; f.t = 0; }
        for (const f of alive) if (f.dive) {
          f.t += dt; f.y += (170 + wave * 12) * S * dt; f.x = f.bx + Math.sin(f.t * 5 + f.ph) * 40 * S;
          if (hitMe(f.x, f.y, 34 * S, 26 * S)) { f.alive = false; burst(f.x, f.y, 10, [C.red, C.ink]); if (hurt("O URGENTE derrubou o cavalo")) return; popText("Urgente!", me.x, me.y - 60 * S, { c: C.red, font: FP, size: 14 }); }
          else if (f.y > me.y + 34 * S) { f.alive = false; if (hurt("Um URGENTE passou")) return; popText("Prazo perdido!", f.x, me.y - 60 * S, { c: C.red, font: FP, size: 14 }); }
        }
        // muralha joga refações
        if (Math.random() < dt * (0.4 + wave * 0.15) && formation.length) { const f = formation[Math.floor(Math.random() * formation.length)]; bombs.push({ x: f.x, y: f.y + 12 * S }); }
        for (const s of shots) for (const f of alive) if (!s.hit && f.alive && Math.abs(s.x - f.x) < 20 * S && Math.abs(s.y - f.y) < 14 * S) {
          s.hit = true; f.hp--;
          if (f.hp <= 0) {
            f.alive = false; addScore(f.type === "urg" ? 20 : f.type === "alt" ? 15 : 8, f.x, f.y - 14 * S); burst(f.x, f.y, 8, [C.ink, C.gold, C.paper2]);
            if (Math.random() < 0.07) drops.push({ x: f.x, y: f.y });
          } else burst(f.x, f.y, 4, [C.ink]);
        }
        for (const bm of bombs) { bm.y += (160 + wave * 10) * S * dt; if (!bm.hit && hitMe(bm.x, bm.y, 30 * S, 24 * S)) { bm.hit = true; if (hurt("A muralha venceu")) return; popText("Atingido!", me.x, me.y - 60 * S, { c: C.red, font: FP, size: 14 }); } }
        bombs = bombs.filter((bm) => bm.y < H && !bm.hit);
        for (const d of drops) { d.y += 150 * S * dt; if (!d.got && hitMe(d.x, d.y, 34 * S, 28 * S)) { d.got = true; power = 6; popText("Cavalo dourado! Lança tripla", W / 2, me.y - 90 * S, { font: FP, size: 14 }); flash = 0.25; flashCol = C.gold; } }
        drops = drops.filter((d) => d.y < H && !d.got);
      },
      draw() {
        drawWall();
        for (const f of fleet) if (f.alive) { if (f.type === "mail") drawMail(f.x, f.y); else if (f.type === "alt") drawAlt(f.x, f.y, f.hp); else drawUrg(f.x, f.y); }
        for (const bm of bombs) pix(BMP.excl, bm.x - 3 * S, bm.y - 9 * S, 3 * S, { "#": C.red });
        for (const d of drops) pix(SHOE, d.x - 7.5 * S, d.y - 6 * S, 3 * S, { "#": C.goldDeep });
        for (const s of shots) { ctx.fillStyle = C.ink; ctx.fillRect(s.x - 1.2 * S, s.y, 2.4 * S, 16 * S); ctx.fillStyle = power > 0 ? C.gold : C.goldDeep; ctx.beginPath(); ctx.moveTo(s.x, s.y - 7 * S); ctx.lineTo(s.x - 4 * S, s.y + 1); ctx.lineTo(s.x + 4 * S, s.y + 1); ctx.closePath(); ctx.fill(); }
        // Cavalo de Troia
        const p = 4 * S, gold = power > 0 && Math.floor(performance.now() / 120) % 2 === 0;
        pix(HORSE, me.x - 8 * p, me.y - 11 * p, p, { "#": gold ? C.gold : C.goldDeep, e: C.paper2, h: C.ink, p: C.ink, o: C.ink });
        if (power > 0) for (let i = 0; i < 3; i++) { const a = performance.now() / 300 + i * 2.1; pix([".#.", "###", ".#."], me.x + Math.cos(a) * 40 * S, me.y - 20 * S + Math.sin(a) * 20 * S, 2.5 * S, { "#": C.gold }); }
      }
    };
  })());

  // ================= HUD e ciclo =================
  function drawHUD() {
    const top = insetTop + 16 * S;
    ctx.textBaseline = "top"; ctx.textAlign = "left"; ctx.fillStyle = C.ink;
    ctx.font = `700 ${22 * S}px ${FP}`; ctx.fillText(String(G.score), Math.max(100, 96 * S), top - 2 * S);
    ctx.font = `600 ${9 * S}px ${FU}`; ctx.fillStyle = C.soft; ctx.fillText("PONTOS", Math.max(101, 97 * S), top + 24 * S);
    ctx.textAlign = "right";
    for (let i = 0; i < G.maxLives; i++) pix(BMP.bolt, W - 18 * S - (i + 1) * 22 * S, top, 3.2 * S, { "#": i < G.lives ? C.goldDeep : "rgba(43,43,43,0.15)" });
    ctx.fillStyle = C.soft; ctx.font = `600 ${9 * S}px ${FU}`; ctx.fillText("VIDAS", W - 16 * S, top + 30 * S);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(14 * S, HUD - 4 * S); ctx.lineTo(W - 14 * S, HUD - 4 * S); ctx.stroke();
    ctx.textAlign = "center"; ctx.fillStyle = C.goldDeep; ctx.font = `italic 500 ${12 * S}px ${FD}`;
    if (W > 520) ctx.fillText(cur.name, W / 2, top + 22 * S);
  }

  function render() {
    drawBg(cur.sun);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * S * shake, (Math.random() - 0.5) * 12 * S * shake);
    cur.draw();
    for (const p of parts) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4)); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); }
    ctx.globalAlpha = 1; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const f of floats) { ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6)); ctx.fillStyle = f.c; ctx.font = `700 ${f.size * S}px ${f.font}`; ctx.fillText(f.txt, f.x, f.y); }
    ctx.globalAlpha = 1; ctx.restore();
    drawHUD();
    if (banner) {
      ctx.globalAlpha = Math.min(1, banner.life * 2); const y = HUD + (H - HUD) * 0.36;
      ctx.fillStyle = C.ink; ctx.fillRect(0, y - 32 * S, W, 64 * S);
      ctx.fillStyle = C.gold; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `italic 700 ${Math.min(30 * S, W / 12)}px ${FD}`; ctx.fillText(banner.txt, W / 2, y);
      ctx.globalAlpha = 1;
    }
    if (flash > 0) { ctx.globalAlpha = Math.min(0.5, flash * 1.3); ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    cur.update(dt);
    for (const p of parts) { p.vy += 900 * S * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; } parts = parts.filter((p) => p.life > 0);
    for (const f of floats) { f.y -= 36 * S * dt; f.life -= dt; } floats = floats.filter((f) => f.life > 0);
    if (shake > 0) shake -= dt; if (flash > 0) flash -= dt; if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    render();
    requestAnimationFrame(loop);
  }

  // ================= telas =================
  const screens = ["scrLogin", "scrMenu", "scrIntro", "scrEnd", "scrRank"];
  function show(id) { for (const s of screens) $(s).hidden = s !== id; $("btnExit").hidden = id !== null; }

  function drawIdle() {
    drawBg(true);
  }

  function renderMenu() {
    $("hello").textContent = "Olá, " + player.name.split(" ")[0];
    const b = bests(), list = $("phaseList"); list.textContent = "";
    PHASES.forEach((p, i) => {
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "phase";
      btn.innerHTML = `<span class="num">${ROMAN[i]}</span><span><span class="nm"></span></span><span class="best"></span>`;
      btn.querySelector(".nm").textContent = p.name;
      btn.querySelector(".best").textContent = b[i] ? b[i] + " pts" : "—";
      btn.addEventListener("click", () => openIntro(i));
      list.appendChild(btn);
    });
    show("scrMenu");
  }

  function openIntro(i) {
    curIndex = i; const p = PHASES[i];
    $("introKicker").textContent = "Fase " + ROMAN[i] + " · estilo " + p.classic;
    $("introTitle").textContent = p.name;
    const ul = $("introHow"); ul.textContent = ""; for (const h of p.how) { const li = document.createElement("li"); li.textContent = h; ul.appendChild(li); }
    show("scrIntro"); $("btnGo").focus();
  }

  function startPhase(i) {
    curIndex = i; cur = PHASES[i];
    G.score = 0; G.maxLives = cur.lives; G.lives = cur.lives;
    floats = []; parts = []; flash = 0; shake = 0; banner = null; ending = false;
    cur.start();
    show(null); running = true; last = performance.now();
    banner = { txt: cur.name, life: 1.3 };
    requestAnimationFrame(loop);
  }

  function showEnd(msg) {
    const isBest = saveBest(curIndex, G.score);
    $("endKicker").textContent = "Fase " + ROMAN[curIndex] + " · " + cur.name;
    $("endTitle").textContent = msg;
    $("endScore").textContent = G.score;
    $("endBest").textContent = isBest && G.score > 0 ? "Novo recorde nesta fase!" : "Seu recorde nesta fase: " + bests()[curIndex] + " pontos";
    sendScore(curIndex, G.score);
    $("btnNext").hidden = curIndex >= PHASES.length - 1;
    show("scrEnd");
    render();
  }

  // ================= eventos =================
  function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener("pointerdown", (e) => { if (!running) return; cv.setPointerCapture && cv.setPointerCapture(e.pointerId); cur.pointer && cur.pointer("down", ...pos(e)); });
  cv.addEventListener("pointermove", (e) => { if (running && cur.pointer) cur.pointer("move", ...pos(e)); });
  const upEv = (e) => { if (running && cur.pointer) cur.pointer("up", ...pos(e)); };
  cv.addEventListener("pointerup", upEv); cv.addEventListener("pointercancel", upEv);
  window.addEventListener("keydown", (e) => { if (!running || !cur.key) return; if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault(); cur.key(e.key, true); });
  window.addEventListener("keyup", (e) => { if (running && cur.key && cur === PHASES[4]) cur.key(e.key, false); });
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => { last = performance.now(); });

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("inName").value.trim(), email = $("inMail").value.trim().toLowerCase();
    if (!name) { $("loginErr").textContent = "Escreva seu nome para aparecer no ranking."; return; }
    if (!/^[^@\s]+@9mm\.com\.br$/.test(email)) { $("loginErr").textContent = "Use o seu e-mail da 9mm (terminado em @9mm.com.br)."; return; }
    player = { name, email }; store.set("olimpo9mm-player", JSON.stringify(player)); $("loginErr").textContent = "";
    renderMenu();
  });
  $("btnLogout").addEventListener("click", () => { store.del("olimpo9mm-player"); player = null; $("inName").value = ""; $("inMail").value = ""; show("scrLogin"); });
  $("btnGo").addEventListener("click", () => startPhase(curIndex));
  $("btnIntroBack").addEventListener("click", renderMenu);
  $("btnAgain").addEventListener("click", () => startPhase(curIndex));
  $("btnNext").addEventListener("click", () => openIntro(curIndex + 1));
  $("btnEndMenu").addEventListener("click", renderMenu);
  $("btnRankMenu").addEventListener("click", () => { show("scrRank"); fetchRank(); });
  $("btnRankBack").addEventListener("click", renderMenu);
  $("btnExit").addEventListener("click", () => { clearTimeout(endTimer); running = false; ending = false; renderMenu(); drawIdle(); });


  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!running) drawIdle(); });
  if (player) { renderMenu(); flushQueue().catch(() => {}); } else show("scrLogin");
})();
</script>
